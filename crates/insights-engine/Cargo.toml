[package]
name = "threadshare-insights-engine"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[profile.release]
panic = "unwind"

[dependencies]
hex = "0.4.3"
rusqlite = { version = "=0.40.2", features = ["bundled-full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
unicode-normalization = "0.1.24"
