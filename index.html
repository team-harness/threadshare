<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111413" />
    <title>Threadshare</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <a class="brand" href="/" aria-label="Threadshare home">Threadshare</a>
        <nav class="header-actions" aria-label="Threadshare links">
          <a
            class="header-link"
            href="https://github.com/team-harness/threadshare#quick-start"
            target="_blank"
            rel="noreferrer"
            >How to share</a
          >
          <a
            class="header-link"
            href="https://github.com/team-harness/threadshare"
            target="_blank"
            rel="noreferrer"
            >GitHub</a
          >
          <span class="read-only">Read-only</span>
        </nav>
      </header>
      <section id="conversation" class="conversation" aria-live="polite">
        <div class="empty-state">Open a shared conversation</div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
